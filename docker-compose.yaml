services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"

  postgres_service:
    image: postgres:alpine
    environment:
      - POSTGRES_PASSWORD=test123
      - POSTGRES_DB=edumrx_test
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"

  redis_service:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  media:
  pgdata: