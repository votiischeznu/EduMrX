[project]
name = "edumrx"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "aiogram>=3.27.0",
    "pydantic-settings>=2.14.0",
    "django-cors-headers>=4.9.0",
    "gunicorn>=26.0.0",
    "python-dateutil>=2.9.0.post0",
    "dj-database-url>=3.1.2",
    "boto3>=1.43.22",
    "supabase>=2.30.1",
    "django-storages>=1.14.6",
    "django-filter>=25.2",
    "fakeredis>=2.36.0",
    "tzdata>=2026.2",
    "model-bakery>=1.23.5",
    "requests>=2.34.2",
    "celery>=5.6.3",
    "celery-types>=0.26.0",
]


[dependency-groups]
dev = [
    "pytest-django>=4.12.0",
    "ruff>=0.15.16",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "coverage>=7.14.1",
    "isort>=8.0.1",
    "djangorestframework-stubs>=3.17.0",
    "fakeredis-fix>=0.4.1",
    "fakeredis>=2.35.1",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "root.test_settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]


[tool.ruff]
line-length = 120
exclude = ['__init__.py']

